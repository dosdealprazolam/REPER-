<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REPER - Suplementos y Alimentos para Exóticos</title>
  <!-- Enlace al archivo CSS externo -->
  <link rel="stylesheet" href="styles.css">
  <!-- FontAwesome para iconos (WhatsApp) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Botón superior para cambiar Tema -->
  <div class="theme-toggle-container">
    <button class="theme-btn" id="themeToggleBtn">🌙 Oscuro</button>
  </div>

  <div class="container">
    
    <!-- Sección Carrusel / Destacados -->
    <section id="rs">
      <h2 id="rn">Cargando destacados...</h2>
      <p id="rx"></p>
      <div id="rv" style="cursor:pointer; color:var(--primary-color); font-weight:bold; margin-top:0.5rem;">Ver producto relacionado</div>
      <div id="rdots" style="margin-top: 1rem; display: flex; gap: 0.5rem;"></div>
    </section>

    <!-- Sección de Productos Congelados / FZ -->
    <section style="margin-top: 2rem;">
      <h3>Alimentos y Congelados</h3>
      <div id="fz"></div>
    </section>

    <!-- Panel Exclusivo para Administrador -->
    <div style="text-align: center;">
      <button class="admin-trigger-btn" onclick="verificarAdmin()">⚙️ Panel de Administración</button>
    </div>

    <div id="admin-panel">
      <h3>Panel de Actualización (Solo Administrador)</h3>
      <p>Aquí puedes gestionar y actualizar los datos de la web de manera segura.</p>
      <!-- Formulario o controles de actualización para el admin -->
      <textarea id="adminDataInput" rows="4" style="width:100%; margin-top:1rem; padding:0.5rem; background:var(--bg-color); color:var(--text-color); border:1px solid var(--border-color); border-radius:6px;" placeholder="Modifica los datos en formato JSON aquí..."></textarea>
      <button class="theme-btn" style="margin-top:1rem;" onclick="guardarDatosAdmin()">Guardar Cambios</button>
    </div>

  </div>

  <!-- Botón Flotante de WhatsApp -->
  <a href="https://wa.me/51999999999?text=Hola%20REPER,%20quiero%20consultar%20por%20sus%20productos" class="whatsapp-float" target="_blank" rel="noopener" aria-label="Chat de WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
  </a>

  <!-- Script optimizado y ordenado -->
  <script>
    const $ = id => document.getElementById(id);

    // --- 1. GESTIÓN DE TEMA OSCURO / CLARO ---
    const themeBtn = $('themeToggleBtn');
    const htmlElement = document.documentElement;

    const savedTheme = localStorage.getItem('reper_theme') || 'light';
    htmlElement.setAttribute('data-theme', savedTheme);
    themeBtn.textContent = savedTheme === 'dark' ? '☀️ Claro' : '🌙 Oscuro';

    themeBtn.onclick = () => {
      const currentTheme = htmlElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      htmlElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('reper_theme', newTheme);
      themeBtn.textContent = newTheme === 'dark' ? '☀️ Claro' : '🌙 Oscuro';
    };

    // --- 2. DATOS Y LÓGICA DE LA WEB ---
    const PR = [
      {n:'Calcio',c:'suplementos',t:'El calcio mantiene huesos y caparazones fuertes y es clave para que las hembras formen huevos sanos.'},
      {n:'Luz UBV Tropical',c:'luz',t:'Los reptiles diurnos necesitan luz UVB para producir vitamina D3 y aprovechar el calcio.'},
      {n:'Foco cerámico',c:'luz',t:'Emite calor infrarrojo sin luz visible, ideal para mantener la temperatura de noche.'},
      {n:'Precios REPER',c:'todo',t:'Producimos e importamos a granel para que cuidar a tus animales exóticos no sea un lujo.'}
    ]; 

    const FE = [
      {n:'3 de marzo: Día Mundial de la Vida Silvestre',m:3,d:3,t:'Cada especie cumple un papel en su ecosistema.'}
    ];

    const CU = [
      {n:'Curiosidad',t:'Los reptiles no producen su propio calor: dependen del ambiente.'}
    ];

    const FZ = [
      {n:'Ratón adulto congelado', d:'Ratones adultos listos para descongelar y ofrecer.', i:'mice', t:[['1 unidad',1,8],['Pack de 10',10,70]]}
    ];

    const fm = num => num.toFixed(2);
    const link = text => `https://wa.me/51999999999?text=${encodeURIComponent(text)}`;

    let R = [];
    [PR, FE, CU].forEach(a => a.forEach(item => R.push(item)));

    let ri = 0;
    const rm = matchMedia('(prefers-reduced-motion:reduce)').matches;

    function setR(i) {
      ri = (i + R.length) % R.length;
      $('rn').textContent = R[ri].n;
      $('rx').textContent = R[ri].t;
      document.querySelectorAll('#rdots button').forEach((b, j) => b.classList.toggle('on', j == ri));
    }

    function showR(i) {
      if (rm) return setR(i);
      setR(i);
    }

    // Renderizar indicadores (dots) del carrusel
    $('rdots').innerHTML = R.map((r, i) => `<button aria-label="${r.n}" data-i="${i}" style="width:12px;height:12px;border-radius:50%;border:none;background:var(--border-color);cursor:pointer;"></button>`).join('');
    $('rdots').onclick = e => { if (e.target.dataset.i !== undefined) showR(+e.target.dataset.i); };

    // Renderizar Productos Congelados
    $('fz').innerHTML = FZ.map(p => `
      <article class="fz">
        <div class="fb">
          <h3>${p.n}</h3>
          <p>${p.d}</p>
          <ul class="tr" style="list-style:none; margin:1rem 0;">
            ${p.t.map(([a, q, b]) => `<li style="display:flex; justify-content:space-between; padding:0.25rem 0;"><span>${a}</span><b>S/ ${b}</b></li>`).join('')}
          </ul>
          <div><a class="theme-btn" style="text-decoration:none; display:inline-block;" target="_blank" rel="noopener" href="${link('Hola REPER, quiero consultar por: '+p.n)}">Pedir por WhatsApp</a></div>
        </div>
      </article>
    `).join('');

    setR(0);

    // --- 3. RESTRICCIÓN DE ADMINISTRADOR ---
    function verificarAdmin() {
      const password = prompt("Introduce la contraseña de Administrador:");
      // Cambia 'reperadmin2026' por la contraseña que prefieras
      if (password === "reperadmin2026") {
        $('admin-panel').classList.toggle('active');
        alert("Acceso concedido. Ya puedes gestionar los datos.");
      } else if (password !== null) {
        alert("Contraseña incorrecta. Acceso denegado.");
      }
    }

    function guardarDatosAdmin() {
      // Aquí puedes programar la lógica para guardar en Base de Datos o localStorage seguro
      alert("Cambios guardados correctamente por el administrador.");
      $('admin-panel').classList.remove('active');
    }
  </script>
</body>
</html>
