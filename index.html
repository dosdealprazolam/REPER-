<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REPER - Suplementos y Alimentos para Exóticos</title>
  <!-- Enlace al CSS separado -->
  <link rel="stylesheet" href="styles.css">
  <!-- FontAwesome para iconos de WhatsApp -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body id="rb">

  <div class="container">
    
    <!-- Controles superiores (Tema y Admin) -->
    <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-bottom: 1.5rem;">
      <button class="theme-btn" id="themeToggleBtn">🌙 Tema</button>
      <button class="theme-btn" onclick="verificarAdmin()">⚙️ Admin</button>
    </div>

    <!-- Sección Carrusel / Destacados -->
    <section id="rs" style="background:var(--card-bg); border:1px solid var(--border-color); padding:1.5rem; border-radius:12px;">
      <h2 id="rn" style="color:var(--primary-color); margin-bottom:0.5rem;">Cargando...</h2>
      <p id="rx"></p>
      <div id="rv" style="cursor:pointer; color:var(--primary-color); font-weight:bold; margin-top:0.5rem; display:none;">Ver producto relacionado</div>
      <div id="rdots" style="margin-top: 1rem; display: flex; gap: 0.5rem;"></div>
    </section>

    <!-- Sección Catálogo -->
    <section id="catalogo">
      <h3 style="font-size: 1.3rem; margin-bottom: 1rem;">Catálogo General</h3>
      <div class="grid-productos" id="gridCat"></div>
    </section>

    <!-- Sección Congelados -->
    <section id="congelado">
      <h3 style="font-size: 1.3rem; margin-bottom: 1rem;">Alimentos y Congelados</h3>
      <div class="grid-productos" id="fz"></div>
    </section>

    <!-- Panel de Administración (Solo Administrador) -->
    <div id="admin-panel">
      <h3>Panel de Actualización (Solo Administrador)</h3>
      <p>Actualiza la información de la página de forma segura.</p>
      <textarea id="adminDataInput" rows="4" style="width:100%; margin-top:1rem; padding:0.5rem; background:var(--bg-color); color:var(--text-color); border:1px solid var(--border-color); border-radius:6px;" placeholder="Edita los datos aquí..."></textarea>
      <button class="theme-btn" style="margin-top:1rem;" onclick="guardarAdmin()">Guardar Cambios</button>
    </div>

  </div>

  <!-- Botón Flotante de WhatsApp -->
  <a href="https://wa.me/51999999999?text=Hola%20REPER,%20quiero%20consultar%20por%20sus%20productos" class="whatsapp-float" target="_blank" rel="noopener" aria-label="WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
  </a>

  <!-- Enlace al archivo de JavaScript externo -->
  <script src="script.js"></script>
</body>
</html>
